  <path fill="#FFFFFF" fill-opacity="0.8" d="M68,49 h8 a4,4 0 0 1 4,4 v2 a4,4 0 0 1 -4,4 h-8 a4,4 0 0 1 -4,-4 v-2 a4,4 0 0 1 4,-4 z" />
  <path fill="#FFFFFF" fill-opacity="0.65" d="M68,64 h2 a4,4 0 0 1 4,4 v2 a4,4 0 0 1 -4,4 h-2 a4,4 0 0 1 -4,-4 v-2 a4,4 0 0 1 4,-4 z" />
