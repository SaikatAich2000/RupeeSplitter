org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Dependencies are checked against gradle/verification-metadata.xml on every build. A mismatch is
# reported but does not stop the build, so an IDE-only download can never break a sync.
# Enforce it with: ./gradlew --dependency-verification strict <tasks>
org.gradle.dependency.verification=lenient
